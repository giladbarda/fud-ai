name: iOS Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install signing assets
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          PROFILE=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db

          echo -n "$CERT_B64" | base64 --decode -o $CERT
          echo -n "$PROFILE_B64" | base64 --decode -o $PROFILE

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $CERT -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive \
            -project calorietracker.xcodeproj \
            -scheme calorietracker \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/build.log

      - name: Show errors
        if: failure()
        run: grep -n -B2 -A5 "error:" /tmp/build.log || tail -300 /tmp/build.log

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        env:
          KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$KEY_B64" | base64 --decode \
            -o ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/export/*.ipa -t ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            /tmp/build.log
            ${{ runner.temp }}/export/*.ipa
