jobs:
  test:
    runs-on: macos-26          # ← במקום macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcodes
        run: ls /Applications | grep -i xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build
        run: |
          cd ios
          set -o pipefail
          xcodebuild clean build \
            -project calorietracker.xcodeproj \
            -scheme calorietracker \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log

      - name: Errors
        if: failure()
        run: grep -n -B2 -A5 "error:" /tmp/build.log || tail -300 /tmp/build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log, path: /tmp/build.log }
