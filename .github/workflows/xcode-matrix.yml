name: List All Xcodes
on: workflow_dispatch

jobs:
  list:
    runs-on: macos-latest
    steps:
      - name: List every Xcode installed
        run: |
          echo "=== All Xcode apps ==="
          ls -la /Applications | grep -i xcode
          echo ""
          echo "=== Versions ==="
          for app in /Applications/Xcode*.app; do
            echo "--- $app ---"
            defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null
          done
